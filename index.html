<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Hetki+ v2.2</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
:root{
  --bg:#0f1412;
  --panel:#111814;
  --panel2:#151d18;
  --line:#2a332d;
  --text:#e8efe9;
  --muted:#9fb39f;
  --green:#7fd36b;
  --yellow:#d6a93a;
  --red:#d65c5c;
  --chip:#1f2a24;
  --accent:#c6da74;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
}
.container{
  max-width:430px;
  margin:auto;
  min-height:100vh;
  background:var(--panel);
}
.lang{
  display:flex;
  gap:6px;
  padding:10px;
  border-bottom:1px solid var(--line);
  position:sticky;
  top:0;
  background:rgba(17,24,20,.98);
  z-index:1000;
}
.lang button,.button,.chip,.ghostBtn{
  background:var(--chip);
  color:var(--text);
  border:none;
  border-radius:8px;
  cursor:pointer;
}
.lang button{
  flex:1;
  padding:10px 6px;
  font-weight:700;
}
#mapWrap{position:relative}
#map{
  height:300px;
  background:#1c2420;
}
.mapHint,.mgrsBadge{
  position:absolute;
  left:10px;
  background:rgba(17,24,20,.88);
  padding:8px 10px;
  border-radius:8px;
  font-size:12px;
  color:var(--muted);
  border:1px solid var(--line);
  z-index:500;
}
.mapHint{top:10px}
.mgrsBadge{bottom:10px;color:var(--text)}
.chipRow{
  display:flex;
  gap:6px;
  padding:10px;
}
.chip{
  padding:8px 10px;
  font-size:12px;
  border:1px solid var(--line);
}
.chip.active{outline:1px solid #667064}
.section{
  padding:14px;
  border-top:1px solid var(--line);
}
.title{
  font-size:12px;
  color:var(--muted);
  margin-bottom:8px;
  font-weight:700;
  letter-spacing:.04em;
}
.big{
  font-size:22px;
  font-weight:700;
  line-height:1.15;
}
.mid{
  font-size:18px;
  font-weight:700;
  line-height:1.2;
}
.small{
  font-size:14px;
  color:var(--muted);
  line-height:1.4;
}
.row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}
.row-wrap{
  display:flex;
  gap:10px;
  align-items:center;
  flex-wrap:wrap;
}
.badge{
  padding:7px 10px;
  border-radius:999px;
  font-size:12px;
  font-weight:700;
}
.good{color:var(--green)}
.warn{color:var(--yellow)}
.bad{color:var(--red)}
.bg-good{background:rgba(127,211,107,.15);color:var(--green)}
.bg-warn{background:rgba(214,169,58,.15);color:var(--yellow)}
.bg-bad{background:rgba(214,92,92,.15);color:var(--red)}
.button{
  padding:12px 12px;
  text-align:center;
  margin-top:10px;
  width:100%;
}
.ghostBtn{
  padding:10px 12px;
  border:1px solid var(--line);
  background:#151d18;
  min-width:120px;
  text-align:center;
}
.slots{
  display:grid;
  gap:10px;
  margin-top:10px;
}
.slot{
  background:var(--panel2);
  border:1px solid var(--line);
  border-radius:10px;
  padding:12px;
  min-height:92px;
}
.timeline{
  display:grid;
  gap:8px;
  margin-top:8px;
}
.day{
  display:grid;
  grid-template-columns:54px 1fr;
  gap:8px;
  align-items:center;
}
.dayname{
  font-size:13px;
  color:var(--muted);
  font-weight:700;
}
.bar{
  display:grid;
  grid-template-columns:repeat(12,1fr);
  gap:3px;
}
.seg{
  height:16px;
  border-radius:4px;
  background:#26312a;
  position:relative;
}
.seg.good{background:var(--green)}
.seg.warn{background:var(--yellow)}
.seg.bad{background:var(--red)}
.seg.mark::after{
  content:"";
  position:absolute;
  inset:-2px;
  border:2px solid #eef4e8;
  border-radius:6px;
}
.hidden{display:none}
.leaflet-container{background:#1c2420}
input[type="datetime-local"]{
  background:#151d18;
  color:var(--text);
  border:1px solid var(--line);
  border-radius:8px;
  padding:10px 12px;
  font:inherit;
  min-width:220px;
}
.helper{
  font-size:12px;
  color:var(--muted);
  margin-top:8px;
}
.sources{opacity:.68}
details.infoBox{
  border-top:1px solid var(--line);
  padding:0 14px 14px;
}
details.infoBox summary{
  list-style:none;
  cursor:pointer;
  color:var(--muted);
  font-size:13px;
  font-weight:700;
  padding:12px 0 0;
}
details.infoBox summary::-webkit-details-marker{display:none}
.infoContent{padding-top:10px}
.subrow{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  margin-top:8px;
  flex-wrap:wrap;
}
.metricItem{margin:8px 0}
.metricMain{
  font-size:16px;
  line-height:1.35;
}
.metricSub{
  margin-left:22px;
  color:var(--muted);
  font-size:14px;
  line-height:1.35;
}
.toast{
  position:fixed;
  left:50%;
  bottom:18px;
  transform:translateX(-50%);
  background:#18201b;
  border:1px solid var(--line);
  padding:10px 12px;
  border-radius:10px;
  color:var(--text);
  font-size:13px;
  display:none;
  z-index:2000;
}
.mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}
</style>
</head>
<body>
<div class="container">
  <div class="lang">
    <button onclick="setLang('fi')">FI</button>
    <button onclick="setLang('en')">EN</button>
    <button onclick="setLang('ua')">UA</button>
  </div>

  <details class="infoBox">
    <summary id="infoSummary"></summary>
    <div class="infoContent">
      <div class="mid">HETKI+ <span>v2.2</span></div>
      <div class="small" id="infoPurpose"></div>
      <div class="small" style="margin-top:10px" id="infoDisclaimer"></div>
      <div class="small" style="margin-top:10px" id="infoSources"></div>
      <div class="small" style="margin-top:10px">© Hetki+</div>
    </div>
  </details>

  <div id="mapWrap">
    <div id="map"></div>
    <div class="mapHint" id="mapHint"></div>
    <div class="mgrsBadge hidden mono" id="mgrsBadge"></div>
  </div>

  <div class="chipRow">
    <button class="chip active" id="radius30" onclick="setRadius(30000)">~30 km</button>
    <button class="chip" id="radius10" onclick="setRadius(10000)">~10 km</button>
    <button class="chip" id="radius80" onclick="setRadius(80000)">~80 km</button>
  </div>

  <div class="section">
    <div class="title" id="startLabel"></div>
    <div class="row-wrap">
      <div class="button" onclick="setStartNow()" id="nowBtn" style="width:auto"></div>
      <input type="datetime-local" id="startPicker">
    </div>
    <div class="helper" id="startHelper"></div>
  </div>

  <div class="section">
    <div class="title" id="bestLabel"></div>
    <div class="big good" id="bestMain"></div>
    <div class="small" id="bestDesc"></div>
    <div class="subrow">
      <div class="small" id="confidenceText"></div>
    </div>
    <button class="button" onclick="shareAssessment()" id="shareBtn"></button>
    <div class="slots">
      <div class="slot">
        <div class="mid" id="slot2"></div>
        <div class="small" id="slot2desc"></div>
      </div>
      <div class="slot">
        <div class="mid" id="slot3"></div>
        <div class="small" id="slot3desc"></div>
      </div>
    </div>
    <button class="button" onclick="toggleMore()" id="moreBtn"></button>
  </div>

  <div class="section">
    <div class="title" id="nowSectionLabel"></div>
    <div class="row">
      <div class="big" id="currentState"></div>
      <div class="badge bg-warn" id="nowBadge"></div>
    </div>
  </div>

  <div class="section hidden" id="moreSection">
    <div class="title" id="timelineLabel"></div>
    <div class="timeline" id="timeline"></div>
  </div>

  <div class="section">
    <div class="title" id="extraLabel"></div>

    <div class="metricItem">
      <div class="metricMain" id="irMetric"></div>
      <div class="metricSub" id="irExplain"></div>
    </div>

    <div class="metricItem">
      <div class="metricMain" id="uasMetric"></div>
      <div class="metricSub" id="uasExplain"></div>
    </div>

    <div class="metricItem">
      <div class="metricMain" id="gnssMetric"></div>
      <div class="metricSub" id="gnssExplain"></div>
    </div>

    <div class="metricItem">
      <div class="metricMain" id="hfMetric"></div>
    </div>
  </div>

  <div class="section small sources" id="footerSources"></div>
</div>

<div class="toast" id="toast"></div>

let lang="fi";
let radius=30000;
let map, marker, circle;
let state={slots:[], windows:[], currentScore:null, selectedStart:null, lastLatLng:null, confidence:null, mgrs:null, gnss:"stable"};

function tr(key){ return dict[lang][key]; }
function clamp(v,min,max){ return Math.max(min, Math.min(max, v)); }
function toLocalInputValue(date){ const d=new Date(date.getTime()-date.getTimezoneOffset()*60000); return d.toISOString().slice(0,16); }
function parseLocalInputValue(value){ return value ? new Date(value) : new Date(); }

function setMaxStart(){
  const p=document.getElementById("startPicker");
  const now=new Date();
  p.max=toLocalInputValue(new Date(now.getTime()+5*24*60*60*1000));
}
function setMinStart(){
  const now=new Date();
  const p=document.getElementById("startPicker");
  p.min=toLocalInputValue(now);
  if(!state.selectedStart || state.selectedStart<now) state.selectedStart=now;
  p.value=toLocalInputValue(state.selectedStart);
}
function setStartNow(){
  state.selectedStart=new Date();
  setMinStart();
  setMaxStart();
  if(state.slots.length) recomputeWindows();
}
function showToast(text){
  const t=document.getElementById("toast");
  t.textContent=text;
  t.style.display="block";
  clearTimeout(window.__toastTimer);
  window.__toastTimer=setTimeout(()=>t.style.display="none",1800);
}
function setLang(l){
  lang=l;
  document.documentElement.lang = l==="ua" ? "uk" : l;
  const mapping = {
    infoSummary:"infoSummary", infoPurpose:"infoPurpose", infoDisclaimer:"infoDisclaimer", infoSources:"infoSources",
    mapHint:"mapHint", startLabel:"start", startHelper:"startHelper", nowBtn:"nowBtn", bestLabel:"best",
    nowSectionLabel:"nowSection", timelineLabel:"timeline", extraLabel:"extra", shareBtn:"share", footerSources:"infoSources"
  };
  Object.entries(mapping).forEach(([id,key]) => document.getElementById(id).textContent = tr(key));
  document.getElementById("moreBtn").textContent = document.getElementById("moreSection").classList.contains("hidden") ? tr("more") : tr("less");
  if(state.mgrs) document.getElementById("mgrsBadge").textContent = state.mgrs;
  setMinStart(); setMaxStart(); renderState();
}
function setRadius(r){
  radius=r;
  ["radius10","radius30","radius80"].forEach(id=>document.getElementById(id).classList.remove("active"));
  document.getElementById(r===10000 ? "radius10" : r===30000 ? "radius30" : "radius80").classList.add("active");
  if(circle) circle.setRadius(radius);
}
function toggleMore(){
  const el=document.getElementById("moreSection");
  el.classList.toggle("hidden");
  document.getElementById("moreBtn").textContent = el.classList.contains("hidden") ? tr("more") : tr("less");
}
function initMap(){
  map=L.map('map',{zoomControl:true}).setView([60.17,24.94],6);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{
    subdomains:'abcd', maxZoom:19, attribution:'&copy; OpenStreetMap &copy; CARTO'
  }).addTo(map);
  map.on('click', async (e)=>{
    const {lat,lng}=e.latlng;
    state.lastLatLng={lat,lng};
    try{ state.mgrs = window.mgrs ? window.mgrs.forward([lng,lat],5) : null; } catch(err){ state.mgrs = null; }
    const badge=document.getElementById("mgrsBadge");
    if(state.mgrs){ badge.textContent=state.mgrs; badge.classList.remove("hidden"); }
    if(marker) map.removeLayer(marker);
    if(circle) map.removeLayer(circle);
    marker=L.circleMarker([lat,lng],{radius:6,color:'#c6da74',weight:2,fillColor:'#c6da74',fillOpacity:.8}).addTo(map);
    circle=L.circle([lat,lng],{radius,color:'#c6da74',weight:1,fillColor:'#c6da74',fillOpacity:.08}).addTo(map);
    await loadForecast(lat,lng);
  });
}
function scoreSlot(visKm, precip, cloud, wind, hour, humidity){
  let score=0;
  if(visKm<2) score+=55;
  else if(visKm<5) score+=38;
  else if(visKm<10) score+=18;
  if(humidity>=90) score+=15;
  else if(humidity>=80) score+=8;
  if(precip>0 && precip<2) score+=10;
  else if(precip>=2 && precip<5) score+=14;
  else if(precip>=5) score+=8;
  if(hour>=21 || hour<5) score+=4;
  if(cloud>80) score+=4;
  if(wind>12) score-=3;
  return clamp(Math.round(score),0,100);
}
function uasMetricLabel(slot){
  let n=0;
  if(slot.wind>=10) n+=45;
  else if(slot.wind>=6) n+=28;
  if(slot.precipitation>=2) n+=28;
  else if(slot.precipitation>0) n+=15;
  if(n>=60) return tr("high");
  if(n>=30) return tr("moderate");
  return tr("weak");
}
function gnssMetricLabel(){
  const score = state.windows.length ? state.windows[0].avg : (state.currentScore || 0);
  if(score >= 75) state.gnss = "stable";
  else if(score >= 45) state.gnss = "possible";
  else state.gnss = "probable";
  return tr(state.gnss);
}
function labelScore(score){
  if(score>=70) return {text:tr("good"), cls:"good"};
  if(score>=40) return {text:tr("moderate"), cls:"warn"};
  return {text:tr("weak"), cls:"bad"};
}
function irMetricLabel(slot){
  let ir=0;
  if(slot.humidity>=90) ir+=40;
  else if(slot.humidity>=80) ir+=25;
  if(slot.precipitation>0 && slot.precipitation<2) ir+=20;
  else if(slot.precipitation>=2) ir+=30;
  if(slot.visibilityKm<5) ir+=15;
  if(ir>=60) return tr("good");
  if(ir>=35) return tr("moderate");
  return tr("weak");
}
function makeReason(slot){
  const reasons=[];
  if(slot.visibilityKm<5) reasons.push(tr("reason_low_vis"));
  if(slot.humidity>=85) reasons.push(tr("reason_high_humidity"));
  if(slot.precipitation>0) reasons.push(tr("reason_rain_snow"));
  if(!reasons.length) reasons.push(tr("reason_not_enough"));
  return reasons.slice(0,3).join(", ");
}
function formatTime(iso){
  const d=new Date(iso);
  const day=dict[lang].dayNames[d.getDay()];
  const hh=String(d.getHours()).padStart(2,'0');
  const mm=String(d.getMinutes()).padStart(2,'0');
  return `${day} ${hh}:${mm}`;
}
function formatEndLabel(startIso,endIso){
  const s=new Date(startIso), e=new Date(endIso);
  const sDay=dict[lang].dayNames[s.getDay()], eDay=dict[lang].dayNames[e.getDay()];
  const hh=String(e.getHours()).padStart(2,'0'), mm=String(e.getMinutes()).padStart(2,'0');
  return sDay===eDay ? `${hh}:${mm}` : `${eDay} ${hh}:${mm}`;
}
function addTwoHours(iso){ const d=new Date(iso); d.setHours(d.getHours()+2); return d.toISOString(); }
function computeConfidenceForWindow(w){
  if(!w) return null;
  const start=new Date(w.startTime), now=new Date();
  const hoursAhead=Math.max(0,(start-now)/36e5);
  let conf=90;
  if(hoursAhead>24 && hoursAhead<=72) conf=76;
  else if(hoursAhead>72) conf=58;
  const matching=state.slots.filter(s=>{ const t=new Date(s.time); return t>=start && t<new Date(w.endTime); });
  const spread=matching.length ? Math.max(...matching.map(s=>s.score)) - Math.min(...matching.map(s=>s.score)) : 10;
  if(spread>25) conf-=10;
  else if(spread<12) conf+=4;
  return clamp(Math.round(conf),40,95);
}
function buildWindowsFromFilteredSlots(slots){
  const windows=[]; let current=null;
  slots.forEach((s,idx)=>{
    const ok=s.score>=40;
    if(!ok){
      if(current && current.hasGood) windows.push(current);
      current=null; return;
    }
    if(!current) current={start:idx,end:idx,scores:[s.score],hasGood:s.score>=70};
    else {
      current.end=idx;
      current.scores.push(s.score);
      if(s.score>=70) current.hasGood=true;
    }
  });
  if(current && current.hasGood) windows.push(current);

  return windows.map((w,i)=>{
    const ss=slots[w.start], es=slots[w.end];
    return {
      rank:i+1,
      startTime:ss.time,
      endTime:addTwoHours(es.time),
      avg:Math.round(w.scores.reduce((a,b)=>a+b,0)/w.scores.length),
      startLabel:formatTime(ss.time),
      endLabel:formatEndLabel(ss.time, addTwoHours(es.time)),
      reason:makeReason(ss)
    };
  }).sort((a,b)=>b.avg-a.avg).slice(0,3).map((w,i)=>({...w,rank:i+1}));
}
function recomputeWindows(){
  const start=state.selectedStart || new Date();
  const filtered=state.slots.filter(s=>new Date(s.time)>=start);
  state.windows=buildWindowsFromFilteredSlots(filtered);
  state.currentScore=filtered[0] ? filtered[0].score : null;
  state.confidence=state.windows.length ? computeConfidenceForWindow(state.windows[0]) : null;
  renderState();
}
async function loadForecast(lat,lon){
  try{
    const url=`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&hourly=visibility,precipitation,cloud_cover,wind_speed_10m,relative_humidity_2m&forecast_days=7&timezone=auto`;
    const res=await fetch(url);
    const data=await res.json();
    const slots=[];
    for(let i=0;i<data.hourly.time.length;i+=2){
      const t=data.hourly.time[i], d=new Date(t);
      const vis1=(data.hourly.visibility[i]||10000)/1000;
      const vis2=((data.hourly.visibility[i+1]||data.hourly.visibility[i]||10000)/1000);
      const visibilityKm=(vis1+vis2)/2;
      const precipitation=((data.hourly.precipitation[i]||0)+(data.hourly.precipitation[i+1]||0))/2;
      const cloud=((data.hourly.cloud_cover[i]||0)+(data.hourly.cloud_cover[i+1]||0))/2;
      const wind=((data.hourly.wind_speed_10m[i]||0)+(data.hourly.wind_speed_10m[i+1]||0))/2;
      const humidity=((data.hourly.relative_humidity_2m[i]||0)+(data.hourly.relative_humidity_2m[i+1]||0))/2;
      slots.push({
        time:t, hour:d.getHours(), visibilityKm, precipitation, cloud, wind, humidity,
        score:scoreSlot(visibilityKm, precipitation, cloud, wind, d.getHours(), humidity)
      });
    }
    state.slots=slots;
    recomputeWindows();
  } catch(e){
    document.getElementById("bestMain").textContent="Virhe / Error";
    document.getElementById("bestDesc").textContent="Kartta tai datayhteys puuttuu.";
  }
}
function renderState(){
  const bestMain=document.getElementById("bestMain"), bestDesc=document.getElementById("bestDesc");
  const slot2=document.getElementById("slot2"), slot2desc=document.getElementById("slot2desc");
  const slot3=document.getElementById("slot3"), slot3desc=document.getElementById("slot3desc");
  const nowBadge=document.getElementById("nowBadge"), currentState=document.getElementById("currentState");
  const confidenceText=document.getElementById("confidenceText");
  document.getElementById("startPicker").value=toLocalInputValue(state.selectedStart || new Date());

  if(!state.slots.length){
    bestMain.textContent=tr("noSelection");
    bestDesc.textContent="";
    slot2.textContent=tr("alternative");
    slot2desc.textContent=tr("noAlt");
    slot3.textContent=tr("reserve");
    slot3desc.textContent=tr("noAlt");
    nowBadge.textContent="";
    currentState.textContent="";
    confidenceText.textContent="";
    document.getElementById("timeline").innerHTML="";
  } else if(!state.windows.length){
    bestMain.textContent=tr("noFuture");
    bestDesc.textContent="";
    slot2.textContent=tr("alternative");
    slot2desc.textContent=tr("noAlt");
    slot3.textContent=tr("reserve");
    slot3desc.textContent=tr("noAlt");
    const now=labelScore(state.currentScore || 0);
    nowBadge.textContent=now.text;
    nowBadge.className=`badge ${now.cls==='good'?'bg-good':now.cls==='warn'?'bg-warn':'bg-bad'}`;
    currentState.textContent=tr("nowState");
    confidenceText.textContent="";
    renderTimeline();
  } else {
    const w1=state.windows[0], w2=state.windows[1], w3=state.windows[2];
    bestMain.textContent=`${tr("recommendation")} · ${w1.startLabel}–${w1.endLabel}`;
    bestDesc.textContent=`${tr("bestDesc")}. ${w1.reason}`;
    slot2.textContent=w2 ? `${tr("alternative")} · ${w2.startLabel}–${w2.endLabel}` : tr("alternative");
    slot2desc.textContent=w2 ? `${tr("altDesc")}. ${w2.reason}` : tr("noAlt");
    slot3.textContent=w3 ? `${tr("reserve")} · ${w3.startLabel}–${w3.endLabel}` : tr("reserve");
    slot3desc.textContent=w3 ? `${tr("resDesc")}. ${w3.reason}` : tr("noAlt");
    const now=labelScore(state.currentScore || 0);
    nowBadge.textContent=now.text;
    nowBadge.className=`badge ${now.cls==='good'?'bg-good':now.cls==='warn'?'bg-warn':'bg-bad'}`;
    currentState.textContent=tr("nowState");
    confidenceText.textContent=state.confidence!=null ? tr("confidence").replace("{v}",state.confidence) : "";
    renderTimeline();
  }

  const basisSlot=state.windows.length ? state.slots.find(s=>s.time===state.windows[0].startTime) : state.slots[0];
  const irVal=basisSlot ? irMetricLabel(basisSlot) : tr("moderate");
  const uasVal=basisSlot ? uasMetricLabel(basisSlot) : tr("weak");
  const gnssVal=gnssMetricLabel();

  document.getElementById("irMetric").textContent=tr("metric_ir_main").replace("{v}", irVal);
  document.getElementById("irExplain").textContent=tr("metric_ir_sub");
  document.getElementById("uasMetric").textContent=tr("metric_uas_main").replace("{v}", uasVal);
  document.getElementById("uasExplain").textContent=tr("metric_uas_sub");
  document.getElementById("gnssMetric").textContent=tr("metric_gnss_main").replace("{v}", gnssVal);
  document.getElementById("gnssExplain").textContent=tr("metric_gnss_sub");
  document.getElementById("hfMetric").textContent=tr("metric_hf_main");
}
function renderTimeline(){
  const timeline=document.getElementById("timeline");
  timeline.innerHTML="";
  if(!state.slots.length) return;
  const start=state.selectedStart || new Date();
  const end=new Date(start.getTime()+5*24*60*60*1000);
  const grouped={};
  state.slots.filter(s=>{
    const t=new Date(s.time);
    return t>=start && t<=end;
  }).forEach(s=>{
    const d=new Date(s.time), key=d.toISOString().slice(0,10);
    if(!grouped[key]) grouped[key]=[];
    grouped[key].push(s);
  });
  const marks=new Set((state.windows||[]).map(w=>w.startTime));
  Object.keys(grouped).slice(0,5).forEach(dateKey=>{
    const slots=grouped[dateKey], d=new Date(dateKey+"T00:00:00");
    const row=document.createElement("div"); row.className="day";
    const day=document.createElement("div"); day.className="dayname"; day.textContent=dict[lang].dayNames[d.getDay()];
    const bar=document.createElement("div"); bar.className="bar";
    slots.slice(0,12).forEach(s=>{
      const seg=document.createElement("div"), lab=labelScore(s.score);
      seg.className=`seg ${lab.cls}${marks.has(s.time)?' mark':''}`;
      bar.appendChild(seg);
    });
    row.append(day,bar);
    timeline.appendChild(row);
  });
}
function buildShareText(){
  if(!state.windows.length) return "";
  const w1=state.windows[0];
  const basisSlot=state.slots.find(s=>s.time===w1.startTime) || state.slots[0];
  const detectability=labelScore(state.currentScore || 0).text;
  const area=state.mgrs ? `${state.mgrs} (~${Math.round(radius/1000)} km)` : (state.lastLatLng ? `${state.lastLatLng.lat.toFixed(3)}, ${state.lastLatLng.lng.toFixed(3)}` : "-");
  return [
    tr("shareTitle"), "",
    `${tr("shareArea")}: ${area}`,
    `${tr("shareTime")}: ${w1.startLabel}–${w1.endLabel}`,
    `${tr("shareDetect")}: ${detectability}`,
    `${tr("shareConf")}: ${state.confidence ?? "-"} %`, "",
    `${tr("shareReason")}: ${w1.reason}`,
    `${tr("shareIR")}: ${basisSlot ? irMetricLabel(basisSlot) : tr("moderate")}`,
    `${tr("shareUAS")}: ${basisSlot ? uasMetricLabel(basisSlot) : tr("weak")}`,
    `${tr("shareGNSS")}: ${gnssMetricLabel()}`,
    `${tr("shareHF")}: ${tr("metric_hf_main").replace("🟨 ","").replace("HF: ","")}`, "",
    tr("infoSources")
  ].join("\n");
}
async function shareAssessment(){
  const text=buildShareText();
  if(!text) return;
  try{
    if(navigator.share){
      await navigator.share({title:"HETKI+", text});
    } else if(navigator.clipboard && navigator.clipboard.writeText){
      await navigator.clipboard.writeText(text);
    } else {
      const ta=document.createElement("textarea");
      ta.value=text; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); document.body.removeChild(ta);
    }
    showToast(tr("shared"));
  } catch(e){
    try{
      if(navigator.clipboard && navigator.clipboard.writeText){
        await navigator.clipboard.writeText(text);
        showToast(tr("shared"));
      }
    } catch(_) {}
  }
}
document.getElementById("startPicker").addEventListener("change", e=>{
  const picked=parseLocalInputValue(e.target.value), now=new Date(), max=new Date(now.getTime()+5*24*60*60*1000);
  state.selectedStart = picked<now ? now : picked>max ? max : picked;
  setMinStart(); setMaxStart();
  if(state.slots.length) recomputeWindows();
});

setLang("fi");
setMinStart();
setMaxStart();
initMap();
</script>
